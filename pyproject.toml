[project]
name = "depth_pro_2"
version = "0.1"
description = "Depth Pro 2: Sharp and Temporally Consistent Metric Monocular Depth"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "av>=14.1",
  "click",
  "huggingface-hub>=1.0",
  "matplotlib",
  "numpy",
  "pillow>=11.3",
  "pillow-heif",
  "timm>=1.0.27,<1.1",
  "torch>=2.7",
  # Windows only, to take it from the same CUDA index as torch: see [tool.uv.sources].
  "torchvision; sys_platform == 'win32'",
]

[project.optional-dependencies]
coreml = ["coremltools==9.0"]

[project.scripts]
depth-pro-2 = "depth_pro_2.cli:main_cli"

# PyPI's Windows torch wheels are CPU-only, so on Windows take torch and torchvision (needed by
# timm) from the PyTorch CUDA index. CUDA 13.0 runs on NVIDIA GPUs from the RTX 20 series (Turing)
# to the RTX 50 series (Blackwell) and needs driver 580 or later. Linux keeps PyPI's torch, which
# already ships with CUDA, and macOS keeps PyPI's torch with MPS.
[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

# Fail to lock, rather than fall back to building from source, if a version lacks Windows wheels.
[tool.uv]
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
lint.select = ["E", "F", "D", "I"]
lint.ignore = ["D1", "D401"]
src = ["src"]
target-version = "py311"

[tool.ruff.lint.pydocstyle]
convention = "google"
